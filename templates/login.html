<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone3D — Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">◈</div>
                <h1 class="login-title">DRONE3D</h1>
                <p class="login-subtitle">Tactical Geospatial Reconstruction</p>
            </div>

            {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'processing:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-input" id="username" name="username"
                        placeholder="Enter your username" autofocus required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password"
                        placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top: 8px;">
                    Sign In
                </button>
            </form>

            <p style="text-align:center; margin-top:24px; font-size:0.75rem; color:var(--text-tertiary);">
                Authorized personnel only. All access is logged.
            </p>
        </div>
    </div>
</body>
</html>
