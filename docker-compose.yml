services:
  # ── Redis Message Broker ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NodeODM Photogrammetry Engine ─────────────────────────
  nodeodm:
    image: opendronemap/nodeodm:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - nodeodm_data:/var/www/data
    command: ["node", "index.js", "--max_concurrency", "1", "--cleanup_tasks_after", "2880"]
    deploy:
      resources:
        limits:
          memory: ${NODEODM_MEMORY_LIMIT:-20G}
          cpus: '12'
        reservations:
          memory: 2G
          cpus: '4'
    tmpfs:
      - /tmp:size=2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/info"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Ollama LLM Inference ──────────────────────────────────
  # By default runs on CPU. For NVIDIA GPU acceleration, use:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
  # For Apple Silicon (MLX), run Ollama natively:
  #   brew install ollama && ollama serve
  #   Then set OLLAMA_HOST=http://host.docker.internal:11434
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "test -f /bin/ollama || exit 0 && ollama list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Django Web Application ────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - db_data:/app/data
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=web
      - REDIS_URL=redis://redis:6379/0
      - NODEODM_HOST=nodeodm
      - NODEODM_PORT=3000
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_healthy
      nodeodm:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Celery Worker ─────────────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    volumes:
      - media_data:/app/media
      - db_data:/app/data
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=worker
      - REDIS_URL=redis://redis:6379/0
      - NODEODM_HOST=nodeodm
      - NODEODM_PORT=3000
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_healthy
      nodeodm:
        condition: service_healthy
      ollama:
        condition: service_started
      web:
        condition: service_healthy

volumes:
  redis_data:
  nodeodm_data:
  media_data:
  static_data:
  db_data:
  ollama_data:
