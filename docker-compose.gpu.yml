# ─────────────────────────────────────────────────────────
# GPU override for Ollama (NVIDIA).
#
# Use this on machines WITH an NVIDIA GPU:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# ─────────────────────────────────────────────────────────
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
